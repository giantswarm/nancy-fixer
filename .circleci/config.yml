version: 2.1

# Diagnostic branch for https://github.com/giantswarm/nancy-fixer/issues/277, never merged:
# a go-build with the architect-orb branch that names the Sonatype Guide status.
orbs:
  architect: giantswarm/architect@dev:fix-277-guide-status

workflows:
  diag:
    jobs:
    - architect/go-build:
        context: architect
        name: go-build
        binary: nancy-fixer
        resource_class: large
        architectures: "linux/amd64"
