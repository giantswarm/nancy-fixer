version: 2.1

orbs:
  architect: giantswarm/architect@10.16.5

workflows:
  test:
    jobs:
    - architect/go-build:
        context: architect
        name: go-build
        binary: nancy-fixer
        resource_class: large
        architectures: "linux/amd64,linux/arm64,darwin/amd64,darwin/arm64,windows/amd64,windows/arm64"
        filters:
          tags:
            only: /^v.*/

    - architect/push-to-registries:
        context: architect
        name: push-to-registries
        requires:
        - go-build
        platforms: "linux/amd64,linux/arm64"
        # Push to gsoci only; the Aliyun mirror is the sync-china-registry job
        # below, so a stalled mirror never holds up the gsoci publish.
        split-china-push: true
        filters:
          tags:
            only: /^v.*/
          branches:
            ignore:
            - main
            - master

    # Mirror gsoci -> Aliyun from the in-China runner. Nothing requires this
    # job: the gsoci push and the release assets publish without it.
    - architect/sync-china-registry:
        context: architect
        name: sync-china-registry
        requires:
        - push-to-registries
        filters:
          tags:
            only: /^v.*/
          branches:
            ignore: /.*/

    - architect/upload-release-assets:
        binary: nancy-fixer
        context: architect
        name: upload-release-assets
        requires:
        - go-build
        filters:
          branches:
            ignore: /.*/
          tags:
            only: /^v.*/
